<div class="sidebar" [ngClass]="open ? 'sidebar--open' : 'sidebar--closed'">
    <div class="sidebar__content">
        <div class="sidebar__section-label">Progetti</div>
        @for (project of projects(); track $index){
            <app-sidebar-element [project]="project"></app-sidebar-element>
        }@empty {
            <p class="sidebar__empty">Nessun progetto</p>
        }
    </div>
    <div class="sidebar__border">
        <button class="sidebar__border__button" (click)="toggleSidebar()" [ngClass]="open ? 'sidebar__border__button--open' : 'sidebar__border__button--closed'">
            {{ open ? '<' : '>' }}
        </button>
    </div>
</div>
