<div class="card" (click)="selectIssue()">
    <div class="card__body">
        <span class="card__title">{{ issue.title }}</span>
        <span class="card__author">{{ issue.author.name }} {{ issue.author.surname }}</span>
        <div class="card__badges">
            <app-type-label [type]="issue.type"></app-type-label>
            <app-priority-label [priority]="issue.priority"></app-priority-label>
            <app-state-label [state]="issue.state"></app-state-label>
        </div>
    </div>
    <span class="card__arrow material-symbols-outlined">chevron_right</span>
</div>
