<div class="issues-filters-component">
    <form class="filters__form">
        <div class="filters__label">Filtra per:</div>

        <div class="form__filter">
            <label class="filter__label" for="type">Tipo</label>
            <select id="type" [field]="filtersForm.type">
                <option value="">Tutti i tipi</option>
                <option value="BUG">Bug</option>
                <option value="FEATURE">Feature</option>
                <option value="DOCUMENTATION">Documentation</option>
                <option value="QUESTION">Question</option>
            </select>
        </div>

        <div class="form__filter">
            <label class="filter__label" for="priority">Priorità</label>
            <select id="priority" [field]="filtersForm.priority">
                <option value="">Tutte le priorità</option>
                <option value="LOW">Low</option>
                <option value="MEDIUM">Medium</option>
                <option value="HIGH">High</option>
            </select>
        </div>

        <div class="form__filter">
            <label class="filter__label" for="state">Stato</label>
            <select id="state" [field]="filtersForm.state">
                <option value="">Tutti gli stati</option>
                <option value="TODO">Todo</option>
                <option value="PENDING">Pending</option>
                <option value="DONE">Done</option>
            </select>
        </div>

        <button type="button" class="filters__reset-button" (click)="resetFilters()">
            <span class="material-symbols-outlined reset-icon">restart_alt</span>
            Ripristina
        </button>
    </form>
</div>
