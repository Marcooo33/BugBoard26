<div class="component" [class.component--description-mode]="descriptionMode">
    <form id="issueForm" [formGroup]="issueForm" (submit)="sendChanges()">

        <!-- ─── Header: author + date ─── -->
        <div class="component__header">
            <div class="component__header__meta">
                @if(!isEditing()){
                    <span class="meta__author">{{ issue()?.author?.name }} {{ issue()?.author?.surname }}</span>
                } @else {
                    <div class="meta__edit-field">
                        <label class="edit-label">Modifica titolo</label>
                        <input type="text" formControlName="title" class="input">
                    </div>
                }
            </div>

            <!-- Ghost edit/cancel buttons top-right -->
            @if (!isViewer()) {
                <div class="component__header__actions">
                    <button type="button"
                        class="action-btn action-btn--ghost"
                        [ngClass]="isEditing() ? '' : 'action-btn--hidden'"
                        (click)="deactivateEditMode()">
                        <span class="material-symbols-outlined btn-icon">close</span>
                        Annulla
                    </button>
                    <button type="button"
                        class="action-btn action-btn--ghost"
                        [ngClass]="!isEditing() ? '' : 'action-btn--hidden'"
                        (click)="activateEditMode()">
                        <span class="material-symbols-outlined btn-icon">edit</span>
                        Modifica
                    </button>
                    <button type="submit"
                        form="issueForm"
                        class="action-btn action-btn--confirm"
                        [ngClass]="isEditing() ? '' : 'action-btn--hidden'">
                        <span class="material-symbols-outlined btn-icon">check</span>
                        Conferma
                    </button>
                </div>
            }
        </div>

        <!-- ─── Tags row (left-aligned) — hidden in description mode, shown in issue header ─── -->
        @if (!descriptionMode) {
            <div class="component__badges">
                <app-type-label [type]="issue()!.type"></app-type-label>
                @if (!isEditing()) {
                    <app-priority-label [priority]="issue()?.priority"></app-priority-label>
                } @else {
                    <select formControlName="priority" class="input">
                        <option [ngValue]="'LOW'">Low</option>
                        <option [ngValue]="'MEDIUM'">Medium</option>
                        <option [ngValue]="'HIGH'">High</option>
                    </select>
                }
                @if (!isEditing()) {
                    <app-state-label [state]="issue()?.state"></app-state-label>
                } @else {
                    <select formControlName="state" class="input">
                        <option [ngValue]="'TODO'">Todo</option>
                        <option [ngValue]="'PENDING'">Pending</option>
                        <option [ngValue]="'DONE'">Done</option>
                    </select>
                }
            </div>
        } @else {
            <!-- In description mode only show the select inputs when editing -->
            @if (isEditing()) {
                <div class="component__badges">
                    <select formControlName="priority" class="input">
                        <option [ngValue]="'LOW'">Low</option>
                        <option [ngValue]="'MEDIUM'">Medium</option>
                        <option [ngValue]="'HIGH'">High</option>
                    </select>
                    <select formControlName="state" class="input">
                        <option [ngValue]="'TODO'">Todo</option>
                        <option [ngValue]="'PENDING'">Pending</option>
                        <option [ngValue]="'DONE'">Done</option>
                    </select>
                </div>
            }
        }

        <!-- ─── Description ─── -->
        <div class="component__body">
            @if (!isEditing()) {
                <p class="body__description">{{ issue()?.description }}</p>
            } @else {
                <label class="edit-label">Modifica descrizione</label>
                <textarea formControlName="description" class="body__description-textarea"></textarea>
            }
        </div>

    </form>
</div>
