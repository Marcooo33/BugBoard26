<div class="content-view-component scroll-component">
    <div class="content__element">
        @if (isIssuesListVisible()) {
            <app-issues-list></app-issues-list>
        } @else if (isIssueViewVisible()) {
            <app-issue-view></app-issue-view>
        } @else {
            <div class="content__element--no-project-selected">
                <img src="/images/Logomark.svg" alt="Seleziona un progetto">
                <p>Seleziona un progetto</p>
            </div>
        }
    </div>
</div>
