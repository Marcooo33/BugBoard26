<div class="add-user-card-component">
    <div class="component__header">Aggiungi Nuova Utenza</div>
    <div class="component__body">
        <form id="userForm" class="body__form" [formGroup]="userForm" (submit)="createUser()">
            <div class="form__field">
                <label for="name">Nome</label>
                <input type="text" formControlName="name" name="name" placeholder="Mario">
            </div>
            <div class="form__field">
                <label for="surname">Cognome</label>
                <input type="text" formControlName="surname" name="surname" placeholder="Rossi">
            </div>
            <div class="form__field">
                <label for="email">Email</label>
                <input type="text" formControlName="email" name="email" placeholder="mario.rossi@azienda.it">
            </div>
            <div class="form__field">
                <label for="password">Password</label>
                <input type="password" formControlName="password" name="password" placeholder="••••••••">
            </div>
            <div class="form__field">
                <label for="role">Ruolo</label>
                <select formControlName="role" name="role">
                    <option value="VIEWER">Viewer</option>
                    <option value="DEVELOPER">Developer</option>
                    <option value="ADMIN">Admin</option>
                </select>
            </div>
        </form>
    </div>
    <div class="component__footer">
        <button class="footer__submit-button" type="submit" form="userForm" (click)="createUser()">Conferma</button>
    </div>
</div>
